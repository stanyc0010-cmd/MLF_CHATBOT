[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanzania-mlf-assistant"
version = "0.1.0"
description = "Evidence-grounded Ministry of Livestock and Fisheries information assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "langchain>=0.2",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "sqlalchemy>=2.0",
  "streamlit>=1.41",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
ai = ["langchain-openai>=0.1", "langchain-ollama>=0.1", "sentence-transformers>=3.0"]
documents = ["docling>=2.0", "pypdf>=5.0"]
exports = ["pandas>=2.2", "openpyxl>=3.1", "reportlab>=4.2"]
observability = ["langfuse>=2.0", "opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
evaluation = ["ragas>=0.1", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mlf-assistant-init-db = "mlf_assistant.db:initialize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"